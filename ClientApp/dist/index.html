<!doctype html><html class="no-js" lang="en" dir="ltr"><head><meta charset="utf-8"/><meta http-equiv="X-UA-Compatible" content="IE=edge"/><title>FuelTrack Admin</title><meta name="description" content="FuelTrack admin panel — manage users, roles, and fuel entry reporting."/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no"><meta name="theme-color" content="#0d9488"/><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><link rel="alternate icon" href="/favicon.ico"/><link rel="apple-touch-icon" href="/favicon.svg"/><link rel="manifest" href="/manifest.webapp"/><link rel="stylesheet" href="/content/vendor/google-fonts/inter.css"/><style>.cursorPointer { cursor: pointer; }

    /* ─── Boot splash — mirrors UnifiedLoader (dual-ring spinner) exactly, ───
       ─── so the hand-off from splash to React loader is seamless.        ─── */
    #app-splash {
      position: fixed; inset: 0; z-index: 999999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: rgba(9,9,11,0.97);
      animation: sp-fade 0.22s ease forwards;
      transition: opacity 0.38s ease, visibility 0.38s ease;
    }
    #app-splash.splash-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    /* spinner canvas — same geometry as UnifiedLoader (outerR 28, innerR 20, sw 3) */
    .sp-rings { position: relative; width: 66px; height: 66px; flex-shrink: 0; }
    .sp-rings svg { position: absolute; inset: 0; overflow: visible; }
    .sp-ring-cw  { transform-origin: center; animation: sp-spin-cw  1s   cubic-bezier(0.45,0.05,0.55,0.95) infinite; }
    .sp-ring-ccw { transform-origin: center; animation: sp-spin-ccw 0.8s cubic-bezier(0.45,0.05,0.55,0.95) infinite; }
    .sp-logo {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      animation: sp-logo-pulse 2.4s ease-in-out infinite;
    }

    /* progress bar */
    .sp-bar {
      width: 120px; height: 2px; border-radius: 2px;
      background: rgba(255,255,255,0.07);
      position: relative; overflow: hidden;
    }
    .sp-bar-fill {
      position: absolute; top: 0; height: 100%;
      background: linear-gradient(90deg,#0d9488,#14b8a6);
      border-radius: 2px;
      animation: sp-bar-slide 1.4s cubic-bezier(0.4,0,0.6,1) infinite;
    }

    /* dots */
    .sp-dots { display: flex; gap: 6px; align-items: center; }
    .sp-dot  { width: 3.5px; height: 3.5px; border-radius: 50%; background: rgba(255,255,255,0.28); }
    .sp-d0 { animation: sp-dot-wave 1.2s ease-in-out 0s    infinite; }
    .sp-d1 { animation: sp-dot-wave 1.2s ease-in-out 0.16s infinite; }
    .sp-d2 { animation: sp-dot-wave 1.2s ease-in-out 0.32s infinite; }

    /* branding */
    .sp-brand { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .sp-brand-icon {
      width: 16px; height: 16px; border-radius: 4px;
      background: linear-gradient(135deg,#0d9488,#14b8a6);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 8px rgba(13,148,136,0.35);
    }
    .sp-brand-icon svg { display: block; }
    .sp-brand-text {
      font-family: 'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: rgba(255,255,255,0.22);
    }

    /* ── keyframes (same as UnifiedLoader KF, prefixed sp-) ── */
    @keyframes sp-fade      { from{opacity:0} to{opacity:1} }
    @keyframes sp-spin-cw   { from{transform:rotate(0deg)}  to{transform:rotate(360deg)}  }
    @keyframes sp-spin-ccw  { from{transform:rotate(0deg)}  to{transform:rotate(-360deg)} }
    @keyframes sp-logo-pulse{ 0%,100%{opacity:0.85;transform:scale(0.97)} 50%{opacity:1;transform:scale(1)} }
    @keyframes sp-bar-slide { 0%{left:-45%;width:45%} 100%{left:100%;width:45%} }
    @keyframes sp-dot-wave  { 0%,60%,100%{transform:translateY(0);opacity:0.35} 30%{transform:translateY(-5px);opacity:1} }

    /* Light theme */
    @media (prefers-color-scheme: light) {
      #app-splash    { background: rgba(248,250,252,0.97); }
      .sp-track      { stroke: rgba(0,0,0,0.06) !important; }
      .sp-bar        { background: rgba(0,0,0,0.06); }
      .sp-dot        { background: rgba(0,0,0,0.22); }
      .sp-brand-text { color: rgba(0,0,0,0.25); }
